# Pipeline for output length prediction only
stages:
  train_outlen:
    foreach: [2, 4, 6, 8, 10]
    do:
      cmd: >
        python output_len_prediction.py
        --n_tokens ${item}
        --data_size 10
        --seed 42
        --use_wandb
      deps:
        - output_len_prediction.py
        - models.py
        - utils.py
        - train.py
        - evaluate.py
        - dataloading.py
        - logger.py