stages:
  preprocess:
    foreach: ${matrix.add_response_token}
    do:
      cmd: >
        python preprocess_dataset.py 
        --model_name ${model_name} 
        --task_type ${task_type} 
        --data_size ${data_size}
        --add_response_token ${item}
        --seed 42
      deps:
        - preprocess_dataset.py
      params:
        - params.yaml:preprocess
        - params.yaml:matrix.add_response_token
      outs:
        - ${dataset_path}_preview${item}:
            cache: true
            persist: true

  train:
    foreach: ${matrix.add_response_token}
    do:
      cmd: >
        python latency_prediction.py 
        --model_name ${model_name}
        --task_type ${task_type}
        --data_size ${data_size}
        --add_response_token ${item}
        --seed 42
        --use_wandb
      deps:
        - latency_prediction.py
        - models.py
        - utils.py
        - train.py
        - evaluate.py
        - dataloading.py
        - logger.py
      params:
        - params.yaml:train
        - params.yaml:matrix.add_response_token
      metrics:
        - ./metrics/${output_filename}_preview${item}.txt:
            cache: false
      outs:
        - ./models/${output_filename}_preview${item}.pth:
            cache: true
        - ./results/${output_filename}_preview${item}:
            cache: true 