stages:
  preprocess:
    foreach: ${matrix.add_response_token}
    do:
      cmd: >
        python preprocess_dataset.py 
        --model_name "vicuna-13b"
        --task_type 0
        --data_size 100000
        --add_response_token ${item}
        --seed 42
      deps:
        - preprocess_dataset.py
      params:
        - params.yaml:preprocess
        - params.yaml:matrix.add_response_token

  train:
    foreach: ${matrix.add_response_token}
    do:
      cmd: >
        python latency_prediction.py 
        --model_name "vicuna-13b"
        --task_type 0
        --data_size 100000
        --add_response_token ${item}
        --seed 42
        --use_wandb
      deps:
        - latency_prediction.py
        - models.py
        - utils.py
        - train.py
        - evaluate.py
        - dataloading.py
        - logger.py
      params:
        - params.yaml:train
        - params.yaml:matrix.add_response_token